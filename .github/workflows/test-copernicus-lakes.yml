name: Test Landsat Lake Temperature

on:
  workflow_dispatch:

jobs:
  test-landsat:
    runs-on: ubuntu-latest

    steps:
      - name: Test Landsat surface temperature
        run: |
          set -e

          echo "======================================"
          echo "Landsat Lake Temperature Test"
          echo "======================================"
          echo ""
          echo "Searching Landsat 8/9 Surface Temperature"
          echo "products for Blue Lake and Gloria Lake."
          echo ""

          python3 -m pip install --quiet requests rasterio numpy

          python3 <<'PY'
          import requests
          import rasterio
          import numpy as np
          import math
          import sys

          STAC_SEARCH = "https://landsatlook.usgs.gov/stac-server/search"

          lakes = [
              {
                  "name": "Blue Lake",
                  "lat": 50.2486488821285,
                  "lon": 30.56133373633814
              },
              {
                  "name": "Gloria Lake",
                  "lat": 50.56906891068027,
                  "lon": 29.922190199229075
              }
          ]

          def find_asset(assets, possible_names):

              for name in possible_names:
                  if name in assets:
                      return assets[name]

              for key, asset in assets.items():

                  text = (
                      str(key) + " " +
                      str(asset.get("title", "")) + " " +
                      str(asset.get("description", ""))
                  ).lower()

                  for name in possible_names:
                      if name.lower() in text:
                          return asset

              return None

          def sample_temperature(asset_url, lon, lat):

              print("")
              print("Opening surface-temperature COG...")
              print(asset_url)
              print("")

              with rasterio.open(asset_url) as src:

                  print("Raster CRS:", src.crs)
                  print("Raster size:", src.width, "x", src.height)
                  print("Raster resolution:", src.res)
                  print("Raster nodata:", src.nodata)

                  try:
                      row, col = src.index(lon, lat)

                      print("Pixel row:", row)
                      print("Pixel column:", col)

                      if (
                          row < 0 or
                          row >= src.height or
                          col < 0 or
                          col >= src.width
                      ):
                          print("Coordinate is outside raster.")
                          return None

                      value = src.read(
                          1,
                          window=((row, row + 1), (col, col + 1))
                      )[0, 0]

                      print("Raw ST DN:", value)

                      if value == 0:
                          print("This is Landsat NoData.")
                          return None

                      if not math.isfinite(float(value)):
                          print("Invalid numeric value.")
                          return None

                      dn = float(value)

                      kelvin = (
                          dn * 0.00341802
                      ) + 149.0

                      celsius = kelvin - 273.15

                      print("")
                      print("Calculated temperature:")
                      print(f"Kelvin:  {kelvin:.2f} K")
                      print(f"Celsius: {celsius:.2f} °C")

                      return celsius

                  except Exception as exc:

                      print("")
                      print("Could not sample pixel:")
                      print(str(exc))

                      return None

          for lake in lakes:

              name = lake["name"]
              lat = lake["lat"]
              lon = lake["lon"]

              print("")
              print("")
              print("######################################")
              print(f"# {name}")
              print("######################################")
              print("")
              print("Latitude:", lat)
              print("Longitude:", lon)
              print("")

              search_request = {
                  "collections": [
                      "landsat-c2l2-st"
                  ],
                  "datetime": "2026-05-01T00:00:00Z/2026-09-03T23:59:59Z",
                  "intersects": {
                      "type": "Point",
                      "coordinates": [
                          lon,
                          lat
                      ]
                  },
                  "limit": 10,
                  "sortby": [
                      {
                          "field": "properties.datetime",
                          "direction": "desc"
                      }
                  ]
              }

              print("Searching USGS Landsat STAC...")
              print("")

              response = requests.post(
                  STAC_SEARCH,
                  json=search_request,
                  timeout=60
              )

              print("HTTP status:", response.status_code)

              if response.status_code != 200:

                  print("")
                  print("ERROR:")
                  print(response.text)
                  continue

              results = response.json()

              features = results.get("features", [])

              print("")
              print("Landsat scenes found:", len(features))
              print("")

              if not features:

                  print("NO LANDSAT SCENES FOUND.")
                  continue

              valid_temperature_found = False

              for index, item in enumerate(features, 1):

                  print("")
                  print("--------------------------------------")
                  print(f"SCENE {index}")
                  print("--------------------------------------")

                  print("Item ID:")
                  print(item.get("id"))

                  print("")
                  print("Date:")
                  print(item.get("properties", {}).get("datetime"))

                  print("")
                  print("Platform:")
                  print(
                      item.get(
                          "properties",
                          {}
                      ).get("platform")
                  )

                  print("")
                  print("Cloud cover:")
                  print(
                      item.get(
                          "properties",
                          {}
                      ).get("eo:cloud_cover")
                  )

                  assets = item.get("assets", {})

                  print("")
                  print("Assets containing temperature data:")

                  for key, asset in assets.items():

                      text = (
                          str(key) + " " +
                          str(asset.get("title", "")) + " " +
                          str(asset.get("description", ""))
                      ).lower()

                      if (
                          "temperature" in text or
                          "st_b10" in text or
                          "lwir" in text
                      ):

                          print(
                              " -",
                              key,
                              "=>",
                              asset.get("href")
                          )

                  st_asset = find_asset(
                      assets,
                      [
                          "ST_B10",
                          "st_b10",
                          "lwir11",
                          "lwir",
                          "st",
                          "surface_temperature"
                      ]
                  )

                  if st_asset is None:

                      print("")
                      print(
                          "No obvious surface-temperature "
                          "asset found in this scene."
                      )

                      continue

                  href = st_asset.get("href")

                  if not href:

                      print("Temperature asset has no URL.")
                      continue

                  print("")
                  print("Selected temperature asset:")
                  print(href)

                  try:

                      temperature = sample_temperature(
                          href,
                          lon,
                          lat
                      )

                      if temperature is not None:

                          print("")
                          print("######################################")
                          print("VALID LANDSAT TEMPERATURE FOUND")
                          print("######################################")
                          print("")
                          print(f"Lake: {name}")
                          print(
                              f"Temperature: "
                              f"{temperature:.2f} °C"
                          )
                          print(
                              "Scene:",
                              item.get("id")
                          )
                          print(
                              "Date:",
                              item.get(
                                  "properties",
                                  {}
                              ).get("datetime")
                          )
                          print("")

                          valid_temperature_found = True

                          break

                  except Exception as exc:

                      print("")
                      print(
                          "Error reading temperature asset:"
                      )
                      print(str(exc))

              print("")
              print("======================================")

              if valid_temperature_found:

                  print(
                      f"{name}: SUCCESS"
                  )

              else:

                  print(
                      f"{name}: NO VALID TEMPERATURE FOUND"
                  )

              print("======================================")

          print("")
          print("")
          print("######################################")
          print("LANDSAT TEST COMPLETE")
          print("######################################")
          PY

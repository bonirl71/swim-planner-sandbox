name: Test Copernicus Lake Temperature

on:
  workflow_dispatch:

jobs:
  test-copernicus:
    runs-on: ubuntu-latest

    steps:
      - name: Test Blue Lake and Gloria Lake
        env:
          COPERNICUS_CLIENT_ID: ${{ secrets.COPERNICUS_CLIENT_ID }}
          COPERNICUS_CLIENT_SECRET: ${{ secrets.COPERNICUS_CLIENT_SECRET }}

        run: |
          set -e

          echo "======================================"
          echo "Copernicus Lake Temperature Test"
          echo "======================================"
          echo ""

          echo "Getting Copernicus access token..."

          TOKEN_RESPONSE=$(curl -sS -X POST \
            "https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=${COPERNICUS_CLIENT_ID}" \
            --data-urlencode "client_secret=${COPERNICUS_CLIENT_SECRET}")

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token')

          if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Authentication failed."
            echo "$TOKEN_RESPONSE"
            exit 1
          fi

          echo "Authentication successful."
          echo ""

          test_lake() {
            NAME="$1"
            LAT="$2"
            LON="$3"

            echo "======================================"
            echo "$NAME"
            echo "Latitude:  $LAT"
            echo "Longitude: $LON"
            echo "======================================"

            MIN_LON=$(awk "BEGIN {print $LON - 0.005}")
            MAX_LON=$(awk "BEGIN {print $LON + 0.005}")
            MIN_LAT=$(awk "BEGIN {print $LAT - 0.005}")
            MAX_LAT=$(awk "BEGIN {print $LAT + 0.005}")

            REQUEST=$(cat <<EOF
          {
            "input": {
              "bounds": {
                "properties": {
                  "crs": "http://www.opengis.net/def/crs/OGC/1.3/CRS84"
                },
                "bbox": [
                  $MIN_LON,
                  $MIN_LAT,
                  $MAX_LON,
                  $MAX_LAT
                ]
              },
              "data": [
                {
                  "type": "byoc-401ca642-a169-4783-b1cf-cbd33e98eccb",
                  "dataFilter": {
                    "timeRange": {
                      "from": "2026-08-01T00:00:00Z",
                      "to": "2026-09-03T23:59:59Z"
                    },
                    "mosaickingOrder": "mostRecent"
                  }
                }
              ]
            },
            "output": {
              "width": 1,
              "height": 1,
              "responses": [
                {
                  "identifier": "default",
                  "format": {
                    "type": "image/tiff"
                  }
                }
              ]
            }
          }
          EOF
          )

            EVALSCRIPT=$(cat <<'EOF'
          //VERSION=3

          function setup() {
            return {
              input: ["LSWT", "NOBS", "QLEVEL"],
              output: {
                id: "default",
                bands: 3,
                sampleType: "FLOAT32"
              }
            };
          }

          function evaluatePixel(sample) {
            return [
              sample.LSWT,
              sample.NOBS,
              sample.QLEVEL
            ];
          }
          EOF
          )

            echo "Requesting LSWT data..."

            HTTP_CODE=$(curl -sS \
              -o "${NAME// /_}.tif" \
              -w "%{http_code}" \
              -X POST \
              "https://sh.dataspace.copernicus.eu/process/v1" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -F "request=${REQUEST}" \
              --form-string "evalscript=${EVALSCRIPT}")

            echo "HTTP status: $HTTP_CODE"

            if [ "$HTTP_CODE" != "200" ]; then
              echo ""
              echo "ERROR: Copernicus returned HTTP $HTTP_CODE"
              echo ""
              echo "Response from Copernicus:"
              cat "${NAME// /_}.tif"
              echo ""
              return 1
            fi

            echo "Response received."

            echo ""
            echo "File information:"
            file "${NAME// /_}.tif"

            echo ""
            echo "First bytes of response:"
            xxd -l 32 "${NAME// /_}.tif"

            echo ""
          }

          test_lake "Blue Lake" \
            "50.2486488821285" \
            "30.56133373633814"

          test_lake "Gloria Lake" \
            "50.56906891068027" \
            "29.922190199229075"

          echo "======================================"
          echo "Both lake requests completed."
          echo "======================================"

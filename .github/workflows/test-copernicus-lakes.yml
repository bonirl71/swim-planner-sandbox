name: Test Copernicus Processed Lakes

on:
  workflow_dispatch:

jobs:
  test-processed-lakes:
    runs-on: ubuntu-latest

    steps:
      - name: Check Copernicus processed lake list
        run: |
          set -e

          echo "======================================"
          echo "Copernicus LSWT Processed Lake Test"
          echo "======================================"
          echo ""

          URL="https://land.copernicus.eu/en/technical-library/list-of-processed-lakes-lake-surface-water-temperature-nrt-version-1/%40%40download/file"

          echo "Downloading official Copernicus"
          echo "LSWT processed-lake list..."
          echo ""

          curl -L --fail \
            "$URL" \
            -o processed_lakes.csv

          echo "Download successful."
          echo ""

          echo "File information:"
          file processed_lakes.csv
          echo ""

          echo "First 10 lines:"
          head -10 processed_lakes.csv
          echo ""

          python3 - <<'PY'
          import csv
          import math

          filename = "processed_lakes.csv"

          lakes = [
              {
                  "name": "Blue Lake",
                  "lat": 50.2486488821285,
                  "lon": 30.56133373633814
              },
              {
                  "name": "Gloria Lake",
                  "lat": 50.56906891068027,
                  "lon": 29.922190199229075
              }
          ]

          print("")
          print("======================================")
          print("SEARCHING COPERNICUS LAKE LIST")
          print("======================================")
          print("")

          with open(
              filename,
              "r",
              encoding="utf-8-sig",
              errors="replace",
              newline=""
          ) as f:

              sample = f.read(5000)
              f.seek(0)

              try:
                  dialect = csv.Sniffer().sniff(sample)
              except csv.Error:
                  dialect = csv.excel

              reader = csv.DictReader(
                  f,
                  dialect=dialect
              )

              rows = list(reader)

          print("Rows in file:", len(rows))
          print("")

          if not rows:
              print("ERROR: No rows found.")
              raise SystemExit(1)

          print("CSV columns:")
          for column in rows[0].keys():
              print(" -", column)

          print("")

          def normalise(value):
              if value is None:
                  return ""
              return str(value).strip().lower()

          def numeric(value):
              try:
                  return float(value)
              except:
                  return None

          for lake in lakes:

              name = lake["name"]
              target_lat = lake["lat"]
              target_lon = lake["lon"]

              print("")
              print("######################################")
              print(name)
              print("######################################")
              print("")

              name_matches = []

              for row in rows:

                  text = " ".join(
                      normalise(v)
                      for v in row.values()
                      if v is not None
                  )

                  if "blue lake" in text if name == "Blue Lake" else "gloria lake" in text:
                      name_matches.append(row)

              print("Name matches:", len(name_matches))

              if name_matches:

                  for row in name_matches[:10]:
                      print("")
                      print("MATCH:")
                      for key, value in row.items():
                          print(f"{key}: {value}")

              print("")

              coordinate_matches = []

              for row in rows:

                  values = list(row.values())

                  nums = [
                      numeric(v)
                      for v in values
                  ]

                  nums = [
                      n for n in nums
                      if n is not None and math.isfinite(n)
                  ]

                  lat_match = any(
                      abs(n - target_lat) < 0.02
                      for n in nums
                  )

                  lon_match = any(
                      abs(n - target_lon) < 0.02
                      for n in nums
                  )

                  if lat_match and lon_match:
                      coordinate_matches.append(row)

              print(
                  "Coordinate matches within ~2 km:",
                  len(coordinate_matches)
              )

              if coordinate_matches:

                  for row in coordinate_matches[:10]:

                      print("")
                      print("COORDINATE MATCH:")

                      for key, value in row.items():
                          print(f"{key}: {value}")

              if not name_matches and not coordinate_matches:

                  print("")
                  print(
                      "NO MATCH FOUND for this lake."
                  )

          print("")
          print("======================================")
          print("PROCESSED LAKE TEST COMPLETE")
          print("======================================")
          PY

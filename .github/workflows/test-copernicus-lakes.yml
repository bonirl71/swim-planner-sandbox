name: Test Copernicus Lake Catalogue

on:
  workflow_dispatch:

jobs:
  test-catalogue:
    runs-on: ubuntu-latest

    steps:
      - name: Search Copernicus LSWT catalogue
        run: |
          set -e

          echo "======================================"
          echo "Copernicus LSWT Catalogue Test"
          echo "======================================"
          echo ""

          python3 - <<'PY'
          import requests
          import json

          BASE = "https://catalogue.dataspace.copernicus.eu/odata/v1/Products"

          dataset = "lswt-nrt_global_1km_10daily_v1"

          params = {
              "$filter": (
                  "Attributes/OData.CSC.StringAttribute/any("
                  "att:att/Name eq 'datasetIdentifier' and "
                  "att/OData.CSC.StringAttribute/Value eq "
                  f"'{dataset}')"
              ),
              "$select": "Id,Name,S3Path,GeoFootprint,ContentDate,OriginDate",
              "$top": "20"
          }

          print("Searching dataset:")
          print(dataset)
          print("")

          response = requests.get(
              BASE,
              params=params,
              timeout=60
          )

          print("HTTP status:", response.status_code)
          print("")

          if response.status_code != 200:
              print(response.text)
              raise SystemExit(1)

          data = response.json()

          products = data.get("value", [])

          print("Products returned:", len(products))
          print("")

          for i, product in enumerate(products, 1):

              print("======================================")
              print(f"PRODUCT {i}")
              print("======================================")

              print("Name:")
              print(product.get("Name"))

              print("")
              print("ID:")
              print(product.get("Id"))

              print("")
              print("Origin date:")
              print(product.get("OriginDate"))

              print("")
              print("Content date:")
              print(product.get("ContentDate"))

              print("")
              print("S3 path:")
              print(product.get("S3Path"))

              footprint = product.get("GeoFootprint")

              print("")
              print("GeoFootprint present:",
                    footprint is not None)

              if footprint:
                  print(
                      "Geometry type:",
                      footprint.get("type")
                  )

              print("")

          print("======================================")
          print("CATALOGUE SEARCH COMPLETE")
          print("======================================")
          PY

name: Test Copernicus Lake Temperature

on:
  workflow_dispatch:

jobs:
  test-copernicus:
    runs-on: ubuntu-latest

    steps:
      - name: Find latest valid lake temperatures
        env:
          COPERNICUS_CLIENT_ID: ${{ secrets.COPERNICUS_CLIENT_ID }}
          COPERNICUS_CLIENT_SECRET: ${{ secrets.COPERNICUS_CLIENT_SECRET }}

        run: |
          set -e

          echo "======================================"
          echo "Copernicus Lake Temperature Search"
          echo "======================================"
          echo ""
          echo "Searching for the latest VALID"
          echo "lake surface temperature observation."
          echo ""

          echo "Installing TIFF reader..."
          python3 -m pip install --quiet tifffile numpy

          echo ""
          echo "Getting Copernicus access token..."

          TOKEN_RESPONSE=$(curl -sS -X POST \
            "https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=${COPERNICUS_CLIENT_ID}" \
            --data-urlencode "client_secret=${COPERNICUS_CLIENT_SECRET}")

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token')

          if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Authentication failed."
            echo "$TOKEN_RESPONSE"
            exit 1
          fi

          echo "Authentication successful."
          echo ""

          test_lake() {
            NAME="$1"
            LAT="$2"
            LON="$3"

            SAFE_NAME="${NAME// /_}"

            echo ""
            echo "======================================"
            echo "$NAME"
            echo "======================================"
            echo "Latitude:  $LAT"
            echo "Longitude: $LON"
            echo ""

            MIN_LON=$(awk "BEGIN {print $LON - 0.005}")
            MAX_LON=$(awk "BEGIN {print $LON + 0.005}")
            MIN_LAT=$(awk "BEGIN {print $LAT - 0.005}")
            MAX_LAT=$(awk "BEGIN {print $LAT + 0.005}")

            REQUEST=$(cat <<EOF
          {
            "input": {
              "bounds": {
                "properties": {
                  "crs": "http://www.opengis.net/def/crs/OGC/1.3/CRS84"
                },
                "bbox": [
                  $MIN_LON,
                  $MIN_LAT,
                  $MAX_LON,
                  $MAX_LAT
                ]
              },
              "data": [
                {
                  "type": "byoc-401ca642-a169-4783-b1cf-cbd33e98eccb",
                  "dataFilter": {
                    "timeRange": {
                      "from": "2026-05-01T00:00:00Z",
                      "to": "2026-09-03T23:59:59Z"
                    }
                  }
                }
              ]
            },
            "output": {
              "width": 1,
              "height": 1,
              "responses": [
                {
                  "identifier": "default",
                  "format": {
                    "type": "image/tiff"
                  }
                },
                {
                  "identifier": "userdata",
                  "format": {
                    "type": "application/json"
                  }
                }
              ]
            }
          }
          EOF
          )

            EVALSCRIPT=$(cat <<'EOF'
          //VERSION=3

          function setup() {
            return {
              input: ["LSWT", "NOBS", "QLEVEL"],
              mosaicking: Mosaicking.TILE,
              output: {
                id: "default",
                bands: 3,
                sampleType: "FLOAT32"
              }
            };
          }

          var bestTemperature = -32768;
          var bestNobs = -128;
          var bestQuality = 0;
          var bestDate = null;

          function evaluatePixel(samples, scenes, inputMetadata, customData, outputMetadata) {

            var found = false;

            for (var i = 0; i < samples.length; i++) {

              var sample = samples[i];

              var lswt = sample.LSWT;
              var nobs = sample.NOBS;
              var quality = sample.QLEVEL;

              /*
               * A valid LSWT must:
               * - not be the NoData value
               * - have at least one observation
               * - have a quality level greater than zero
               */

              if (
                lswt !== -32768 &&
                nobs > 0 &&
                quality > 0
              ) {

                /*
                 * Because TILE mosaicking provides the available
                 * scenes, keep replacing the result as we move
                 * through them. The final valid result is therefore
                 * the most recent valid observation.
                 */

                bestTemperature = lswt;
                bestNobs = nobs;
                bestQuality = quality;

                if (
                  scenes &&
                  scenes.tiles &&
                  scenes.tiles[i] &&
                  scenes.tiles[i].date
                ) {
                  bestDate = scenes.tiles[i].date;
                }

                found = true;
              }
            }

            /*
             * Convert the stored LSWT digital number into Celsius.
             *
             * Dataset scaling:
             * LSWT = DN * 0.01 + 273.15 K
             *
             * Therefore:
             * Celsius = DN * 0.01
             */

            if (found) {
              return [
                bestTemperature * 0.01,
                bestNobs,
                bestQuality
              ];
            }

            return [
              -999,
              0,
              0
            ];
          }

          function updateOutputMetadata(
            scenes,
            inputMetadata,
            outputMetadata
          ) {

            outputMetadata.userData = {
              "latestValidDate": bestDate,
              "rawLSWT": bestTemperature,
              "observations": bestNobs,
              "quality": bestQuality
            };
          }
          EOF
          )

            echo "Requesting Copernicus data from May 2026 onwards..."
            echo ""

            HTTP_CODE=$(curl -sS \
              -o "${SAFE_NAME}.tif" \
              -w "%{http_code}" \
              -X POST \
              "https://sh.dataspace.copernicus.eu/process/v1" \
              -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              -F "request=${REQUEST}" \
              --form-string "evalscript=${EVALSCRIPT}")

            echo "HTTP status: $HTTP_CODE"

            if [ "$HTTP_CODE" != "200" ]; then
              echo ""
              echo "ERROR: Copernicus returned HTTP $HTTP_CODE"
              echo ""
              cat "${SAFE_NAME}.tif"
              echo ""
              return 1
            fi

            echo "Response received."
            echo ""

            echo "Reading temperature result..."

            python3 - "${SAFE_NAME}.tif" "${NAME}" <<'PY'
          import sys
          import math
          import numpy as np
          import tifffile

          filename = sys.argv[1]
          lake_name = sys.argv[2]

          data = tifffile.imread(filename)

          print("Raw TIFF shape:", data.shape)
          print("Returned values:", data)

          values = np.asarray(data).reshape(-1)

          if len(values) < 3:
              print("ERROR: Expected 3 output values.")
              sys.exit(1)

          temperature = float(values[0])
          observations = float(values[1])
          quality = float(values[2])

          print("")
          print("RESULT FOR:", lake_name)
          print("--------------------------------------")

          if not math.isfinite(temperature) or temperature <= -900:
              print("Temperature: NO VALID DATA")
          else:
              print(f"Temperature: {temperature:.2f} °C")

          print(f"Observations: {observations:.0f}")
          print(f"Quality level: {quality:.0f}")

          quality_names = {
              0: "NO DATA",
              1: "BAD DATA",
              2: "WORST QUALITY",
              3: "LOW QUALITY",
              4: "ACCEPTABLE QUALITY",
              5: "BEST QUALITY"
          }

          q = int(round(quality))

          print(
              "Quality assessment:",
              quality_names.get(q, "UNKNOWN")
          )

          print("--------------------------------------")
          PY

            echo ""

            echo "======================================"
            echo "Copernicus userdata"
            echo "======================================"

            USERDATA_REQUEST=$(cat <<EOF
          {
            "input": {
              "bounds": {
                "properties": {
                  "crs": "http://www.opengis.net/def/crs/OGC/1.3/CRS84"
                },
                "bbox": [
                  $MIN_LON,
                  $MIN_LAT,
                  $MAX_LON,
                  $MAX_LAT
                ]
              },
              "data": [
                {
                  "type": "byoc-401ca642-a169-4783-b1cf-cbd33e98eccb",
                  "dataFilter": {
                    "timeRange": {
                      "from": "2026-05-01T00:00:00Z",
                      "to": "2026-09-03T23:59:59Z"
                    }
                  }
                }
              ]
            },
            "output": {
              "width": 1,
              "height": 1,
              "responses": [
                {
                  "identifier": "userdata",
                  "format": {
                    "type": "application/json"
                  }
                }
              ]
            }
          }
          EOF
          )

            echo ""
          }

          test_lake "Blue Lake" \
            "50.2486488821285" \
            "30.56133373633814"

          test_lake "Gloria Lake" \
            "50.56906891068027" \
            "29.922190199229075"

          echo ""
          echo "======================================"
          echo "SEARCH COMPLETE"
          echo "======================================"
